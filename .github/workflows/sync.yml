name: Sincronizar notícias do artifact

on:
  schedule:
    - cron: "12,27,42,57 * * * *"   # 4x por hora (o artifact é atualizado ao minuto ~13)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ir buscar news.json e archive.json ao artifact
        id: fetch
        run: |
          set -e
          BASE="https://claude.ai/artifact/CG2kGiBKY21Sm6xkAQjsTy"
          ok=1
          for f in news.json archive.json; do
            code=$(curl -sS -L -A "Mozilla/5.0 (PortugalRadar sync)" -H "Accept: application/json" -o "/tmp/$f" -w "%{http_code}" "$BASE/$f" || echo 000)
            echo "$f -> HTTP $code, $(wc -c < /tmp/$f) bytes"
            if [ "$code" != "200" ] || ! python3 -c "import json,sys; d=json.load(open('/tmp/$f')); assert 'items' in d" 2>/dev/null; then
              echo "::warning::$f não é JSON válido (HTTP $code). Primeiros bytes:"; head -c 300 "/tmp/$f"; echo; ok=0
            fi
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Copiar e publicar se houver alterações
        if: steps.fetch.outputs.ok == '1'
        run: |
          set -e
          # só avança se a versão do artifact for mais recente do que a do site
          NEW=$(python3 -c "import json;print(json.load(open('/tmp/news.json')).get('updated',''))")
          CUR=$(python3 -c "import json;print(json.load(open('news.json')).get('updated',''))" 2>/dev/null || echo "")
          echo "site: $CUR | artifact: $NEW"
          if [ "$NEW" \> "$CUR" ]; then
            cp /tmp/news.json news.json; cp /tmp/archive.json archive.json
            git config user.name "Portugal Radar bot"
            git config user.email "tcostafoto-bit@users.noreply.github.com"
            git add news.json archive.json
            git commit -m "Atualização automática das notícias ($NEW)"
            git push
            echo "Publicado: $NEW"
          else
            echo "Sem alterações."
          fi
