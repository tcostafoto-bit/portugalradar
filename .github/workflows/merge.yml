name: Fundir notícias da caixa de entrada

on:
  push:
    paths:
      - "inbox/**"
      - "seo_build.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fundir cada ficheiro da caixa de entrada
        run: |
          set -e
          shopt -s nullglob
          files=(inbox/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "Caixa de entrada vazia"; exit 0; fi
          for f in $(ls inbox/*.json | sort); do
            echo "== $f"
            python3 - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          json.dump(d.get("new_items", []), open("new_items.json", "w", encoding="utf-8"), ensure_ascii=False)
          json.dump(d.get("market", {}), open("market.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
            python3 radar_merge.py .
            rm -f new_items.json market.json
            git rm -q "$f"
          done

      - name: SEO (capa estática, páginas por secção, sitemap, RSS)
        run: python3 seo_build.py .

      - name: Publicar
        run: |
          git config user.name "Portugal Radar bot"
          git config user.email "tcostafoto-bit@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sem alterações"; exit 0; fi
          git commit -q -m "Atualização automática das notícias"
          git pull -q --rebase origin main || true
          git push -q origin main

      - name: Avisar Bing/Yandex (IndexNow)
        continue-on-error: true
        run: |
          KEY=3dce3190845ad84d85c0088bc4641e3a
          URLS=$(python3 -c "import re,json;print(json.dumps(re.findall(r'<loc>([^<]+)</loc>',open('sitemap.xml').read())))")
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"portugalradar.pt\",\"key\":\"$KEY\",\"keyLocation\":\"https://portugalradar.pt/$KEY.txt\",\"urlList\":$URLS}"
